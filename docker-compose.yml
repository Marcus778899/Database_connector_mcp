# The split that matters is in the volumes, not in the images: `provision`
# holds the signing key and never listens, `server` listens and never sees a
# signing key. Losing the server therefore does not get you the ability to
# issue yourself a token.

name: database-mcp-connector

x-image: &image
  image: database-mcp-connector:${MCP_TAG:-slim}
  build:
    context: .
    target: ${MCP_TARGET:-slim}

services:
  # One-shot. `server` waits for this to exit 0, so a failed provision keeps
  # the server down rather than serving an allowlist nobody is in.
  provision:
    <<: *image
    command: provision
    restart: "no"
    environment:
      PROVISION_KID: ${PROVISION_KID:-agent}
      # Comma separated; the tools this token may call. Nothing else is
      # reachable with it.
      PROVISION_SCOPES: ${PROVISION_SCOPES:-list_containers,get_columns,get_sample}
      PROVISION_LIFETIME: ${PROVISION_LIFETIME:-30d}
      # Must match the server's, or every request verifies as forged.
      MCP_AUDIENCE: ${MCP_AUDIENCE:-etl-agent-mcp}
    volumes:
      - mcp-keys:/keys # public halves, shared with the server
      - mcp-private:/private # signing key, deliberately not shared
      - ./out:/out # the token, for you to collect

  server:
    <<: *image
    command: serve
    restart: unless-stopped
    depends_on:
      provision:
        condition: service_completed_successfully
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_REQUIRE_AUTH: "true"
      MCP_AUDIENCE: ${MCP_AUDIENCE:-etl-agent-mcp}
      MCP_AUTHORIZED_KEYS_DIR: /keys

      MCP_ENGINE: ${MCP_ENGINE:-sqlite}
      # Names the prefix of the <REF>_HOST / <REF>_URI / <REF>_PATH … variables
      # below. The connection itself is never a build argument: that would put
      # it in `docker history`.
      MCP_CONNECTION_REF: ${MCP_CONNECTION_REF:-shop}

      # State, all of it on the volume rather than in the image.
      MCP_STAGING_DB: /data/staging.db
      MCP_AUDIT_LOG: /data/audit/audit.jsonl
      MCP_EXPORT_DIR: /data/export
    # Connection secrets come from a file git never sees. SHOP_HOST,
    # SHOP_USER, SHOP_PASSWORD, SHOP_DB … for MCP_CONNECTION_REF=shop.
    env_file:
      - path: .env
        required: false
    volumes:
      - mcp-keys:/keys:ro # read-only: the server only ever verifies
      - mcp-data:/data
      # A file-backed engine needs its source reachable from inside the
      # container, and read-only says the connector is not the thing that
      # writes to it. Networked engines want nothing here.
      #   MCP_ENGINE=sqlite   SHOP_PATH=/source/shop.db
      #   MCP_ENGINE=datalake SHOP_PATH=/source
      # - ./shop.db:/source/shop.db:ro
    ports:
      - "${MCP_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      # The MCP endpoint answers only to a proper session, so this checks the
      # one thing a probe can honestly check: that the port is accepting.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mcp-keys:
  mcp-private:
  mcp-data:
