[project]
name = "database-mcp-connector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loggerhelper",
    "pydantic>=2.7",
]

[project.scripts]
mcp-connector = "mcp_connector.main:main"

[project.optional-dependencies]
server = [
    "fastmcp>=2.3",
    "pyjwt>=2.8",
    "cryptography>=42",
]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.1"]
mongo = ["pymongo>=4.6"]
datalake = ["pyarrow>=15"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fastmcp>=2.3",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.sources]
loggerhelper = { path = "lib/loggerhelper-1.0.0-py3-none-any.whl" }
