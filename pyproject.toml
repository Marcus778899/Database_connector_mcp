[project]
name = "database-mcp-connector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loggerhelper",
    "pydantic>=2.7",
]

[project.scripts]
mcp-connector = "main:main"

[project.optional-dependencies]
server = [
    "fastmcp>=3.0",
    "pyjwt>=2.8",
    "cryptography>=42",
]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.1"]
mongo = ["pymongo>=4.6"]
datalake = ["pyarrow>=17"]
mcp = ["fastmcp>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fastmcp>=3.0",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pyarrow>=17",
    # Tests only, to check that a generated SKILL.md's frontmatter parses. The
    # server never reads YAML; the clients that load a skill do.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src", "main.py"]

# So the CLI (`uvx pyright`) and Pylance in the editor agree.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "main.py"]
# Pylance surfaces these in the editor; make the CLI agree so CI catches them too.
reportDeprecated = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.sources]
loggerhelper = { path = "lib/loggerhelper-1.0.0-py3-none-any.whl" }
